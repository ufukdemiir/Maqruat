backend:
  name: github
  repo: ufukdemiir/Okurken
  branch: main
  # Bu URL, README.md içindeki "Decap CMS için GitHub OAuth Kurulumu"
  # bölümünde kendi Cloudflare Worker adresinizle değiştirilmelidir.
  base_url: https://sveltia-cms-auth.demiirufuk.workers.dev
  auth_endpoint: auth

# Yayınlama: her kayıt doğrudan `branch`e commit edilir. Taslak/inceleme
# akışı isteniyorsa aşağıdaki satırı etkinleştirin:
# publish_mode: editorial_workflow

locale: "tr"

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://ufukdemiir.github.io/Okurken
display_url: https://ufukdemiir.github.io/Okurken
logo_url: /favicon.svg

collections:
  # "Profil / Avatar" BİLİNÇLİ OLARAK "Site Ayarları"ndan ayrı, tek başına bir
  # koleksiyon. Ana sayfada adınızın yanında gösterilecek görsel/rozet
  # burada yönetilir; bkz. src/content.config.ts'teki "avatar" koleksiyonu
  # için düşülen not.
  - name: "avatar"
    label: "Profil / Avatar"
    files:
      - name: "main"
        label: "Profil / Avatar"
        file: "src/data/avatar.json"
        description: "Ana sayfada, adınızın solunda gösterilebilecek görsel ya da rozet. Her iki alan da isteğe bağlıdır."
        fields:
          - {
              label: "Baş Harfler",
              name: "initials",
              widget: "string",
              required: false,
              hint: "Profil Fotoğrafı yüklemediyseniz, ana sayfada adınızın solunda küçük yuvarlak bir rozette görünen 1-2 harf (ör. 'UD'). Bir Profil Fotoğrafı yüklerseniz bu alan yerine o fotoğraf gösterilir. İkisi de boşsa hiçbir rozet/görsel gösterilmez, sorun oluşturmaz.",
            }
          - {
              label: "Profil Fotoğrafı",
              name: "image",
              widget: "image",
              required: false,
              hint: "Ana sayfada adınızın solunda yuvarlak bir fotoğraf olarak görünür ve doldurulduğunda Baş Harfler rozetinin yerini alır. En iyi görünüm için kare (1:1) bir fotoğraf seçin.",
            }
  - name: "books"
    label: "Kitaplar"
    label_singular: "Kitap"
    folder: "src/content/books"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{author}} ({{status}})"
    sortable_fields: ["title", "author", "startDate", "endDate", "rating"]
    view_filters:
      - label: "Okunuyor"
        field: status
        pattern: "reading"
      - label: "Okundu"
        field: status
        pattern: "completed"
      - label: "Okunacak"
        field: status
        pattern: "want-to-read"
      - label: "Yarım Bırakıldı"
        field: status
        pattern: "dropped"
    fields:
      - {
          label: "Başlık",
          name: "title",
          widget: "string",
          hint: "Kitabın adı. Kitap kartlarında, sayfa başlığında ve sayfa adresinde (URL) kullanılır.",
        }
      - {
          label: "Yazar",
          name: "author",
          widget: "string",
          hint: "Yazarın tam adı. 'Yazarlar' sayfası bu alana göre otomatik oluşur; aynı yazarın tüm kitaplarında adı BİREBİR AYNI şekilde yazın (ör. hep 'Fyodor Dostoyevski' — bazen kısaltmayın), yoksa aynı yazar iki ayrı kişi gibi görünür.",
        }
      - {
          label: "Yayınevi",
          name: "publisher",
          widget: "string",
          required: false,
          hint: "İsteğe bağlıdır. Kitap detay sayfasında küçük bir bilgi olarak gösterilir.",
        }
      - {
          label: "Sayfa Sayısı",
          name: "pageCount",
          widget: "number",
          value_type: "int",
          required: false,
          min: 1,
          hint: "Kitabın toplam sayfa sayısı. İstatistikler sayfasındaki 'toplam okunan sayfa', 'ortalama sayfa/kitap' ve 'en uzun/en kısa kitap' hesaplamaları için kullanılır.",
        }
      - {
          label: "Başlangıç Tarihi",
          name: "startDate",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
          hint: "Kitaba başladığınız tarih. Bitiş Tarihi ile birlikte 'ortalama bitirme süresi' ve 'en hızlı/en yavaş okunan kitap' istatistiklerinde kullanılır.",
        }
      - {
          label: "Bitiş Tarihi",
          name: "endDate",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          required: false,
          hint: "Kitabı bitirdiğiniz ya da yarım bıraktığınız tarih. İstatistikler sayfasındaki aylık/yıllık grafiklerde ve '[yıl] İstatistikleri' sayfalarında kitabın hangi yıla sayılacağını bu tarih belirler.",
        }
      - label: "Durum"
        name: "status"
        widget: "select"
        hint: "Kitabın şu anki durumu. 'Okunuyor' → ana sayfada 'şu an okunuyor' bölümünde görünür. 'Okundu' → tamamlanmış sayılır, istatistiklere (puan, sayfa, süre ortalamaları) dahil olur. 'Okunacak' → henüz başlanmamış kitap olarak listelenir. 'Yarım Bırakıldı' → ayrı sayılır, tamamlanmış ortalamalarına dahil edilmez."
        options:
          - { label: "Okunuyor", value: "reading" }
          - { label: "Okundu", value: "completed" }
          - { label: "Okunacak", value: "want-to-read" }
          - { label: "Yarım Bırakıldı", value: "dropped" }
      - {
          label: "Puan (1-10)",
          name: "rating",
          widget: "number",
          value_type: "int",
          min: 1,
          max: 10,
          required: false,
          hint: "1-10 arası puanınız. Yalnızca puanladığınız kitaplar İstatistikler'deki 'ortalama puan' ve 'en yüksek puanlılar' listesine dahil edilir; boş bırakırsanız o kitap bu hesaplamalara girmez.",
        }
      - {
          label: "Şu Ana Kadar Okunan Sayfa",
          name: "pagesRead",
          widget: "number",
          value_type: "int",
          min: 0,
          required: false,
          hint: "Yalnızca 'Okunuyor' veya 'Yarım Bırakıldı' durumundaki kitaplar için doldurun. İstatistiklerdeki 'günde okunan ortalama sayfa' hesaplamasının doğru olması için önemlidir.",
        }
      - {
          label: "Türler",
          name: "genres",
          widget: "list",
          field: { label: "Tür", name: "genre", widget: "string" },
          required: false,
          hint: "Serbest metin — istediğiniz herhangi bir türü yazabilirsiniz (ör. Dini Kitaplar, Dil Eğitimi, Yabancı Dil, Şiir). Sabit bir liste değildir.",
        }
      - {
          label: "Eser Adı (birden fazla ciltse)",
          name: "seriesTitle",
          widget: "string",
          required: false,
          hint: "Yalnızca birden fazla ciltten oluşan eserler için doldurun. Tüm ciltlerde AYNI yazılmalı (ör. 'Savaş ve Barış'). Kitabın kendi başlığına cilt numarasını eklemenize gerek yok, otomatik gösterilir.",
        }
      - {
          label: "Cilt Numarası",
          name: "volumeNumber",
          widget: "number",
          value_type: "int",
          min: 1,
          required: false,
          hint: "Yalnızca 'Eser Adı' doldurulduysa anlamlıdır.",
        }
      - label: "Notlar"
        name: "notes"
        widget: "list"
        required: false
        hint: "Kitabı okurken aldığınız serbest notlar. Kitap detay sayfasında listelenir ve İstatistikler'deki 'en çok not alınanlar' sıralamasını besler."
        field: { label: "Not", name: "note", widget: "text", hint: "Tek bir not metni." }
      - label: "Alıntılar"
        name: "quotes"
        widget: "list"
        required: false
        hint: "Kitaptan beğendiğiniz alıntılar. 'Alıntılar' sayfasında ve kitabın kendi sayfasında listelenir; İstatistikler'deki 'en çok alıntılananlar' sıralamasını besler."
        fields:
          - { label: "Metin", name: "text", widget: "text", hint: "Alıntının tam metni." }
          - { label: "Sayfa", name: "page", widget: "number", value_type: "int", required: false, min: 1, hint: "Alıntının geçtiği sayfa numarası (isteğe bağlı)." }
      - {
          label: "İnceleme (Markdown)",
          name: "body",
          widget: "markdown",
          required: false,
          media_folder: "/public/uploads",
          public_folder: "/uploads",
          hint: "Metin içine görsel eklemek için araç çubuğundaki resim simgesini kullanın; site adresinizin başına eklenmesi gereken ön ek otomatik olarak eklenir, siz sadece görseli seçin. Erişilebilirlik ve SEO için görsele mutlaka açıklayıcı bir 'alt metin' yazın.",
        }
      - {
          label: "Taslak",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
          hint: "İşaretlerseniz bu kitap taslak sayılır ve yayınlanan sitede hiçbir yerde görünmez; yalnızca siz bu panelden görebilirsiniz.",
        }

  - name: "blog"
    label: "Blog"
    label_singular: "Yazı"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["publishDate", "title"]
    fields:
      - {
          label: "Başlık",
          name: "title",
          widget: "string",
          hint: "Yazının başlığı. Blog listesinde, sekme başlığında ve paylaşım kartlarında (Google, sosyal medya) kullanılır.",
        }
      - {
          label: "Yayın Tarihi",
          name: "publishDate",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          hint: "Blog listesinde yazılar bu tarihe göre sıralanır ve yazının üstünde gösterilir.",
        }
      - {
          label: "Kısa Özet",
          name: "excerpt",
          widget: "text",
          required: false,
          hint: "Listeleme ve arama motoru açıklaması için. Boş bırakılırsa yazının ilk cümlelerinden otomatik üretilir.",
        }
      - {
          label: "Etiketler",
          name: "tags",
          widget: "list",
          field: { label: "Etiket", name: "tag", widget: "string" },
          required: false,
          hint: "Yazıyı sınıflandırmak için serbest etiketler (ör. 'Serbest Fikirler'). Yazının altında gösterilir.",
        }
      - {
          label: "Yazı (Markdown)",
          name: "body",
          widget: "markdown",
          media_folder: "/public/uploads",
          public_folder: "/uploads",
          hint: "Metin içine görsel eklemek için araç çubuğundaki resim simgesini kullanın; site adresinizin başına eklenmesi gereken ön ek otomatik olarak eklenir, siz sadece görseli seçin. Erişilebilirlik ve SEO için görsele mutlaka açıklayıcı bir 'alt metin' yazın.",
        }
      - { label: "Taslak", name: "draft", widget: "boolean", default: false, required: false, hint: "İşaretlerseniz bu yazı taslak sayılır ve yayınlanan sitede hiçbir yerde görünmez; yalnızca siz bu panelden görebilirsiniz." }

  - name: "settings"
    label: "Site Ayarları"
    files:
      - name: "main"
        label: "Genel Ayarlar"
        file: "src/data/site.json"
        # NOT: Aşağıdaki alanların tamamı bilinçli olarak "required: false"
        # (zorunlu değil) olarak ayarlanmıştır. Böylece tek bir alanı
        # güncellemek için diğerlerine dokunmanız gerekmez. Her alanın altına,
        # doldurulduğunda sitede tam olarak nerede ve nasıl kullanıldığını
        # açıklayan bir ipucu eklendi. Bir alanı boş bırakırsanız kod
        # tarafında güvenli bir varsayılan değer devreye girer; site asla
        # bozulmaz.
        fields:
          - {
              label: "Okur Adı",
              name: "readerName",
              widget: "string",
              required: false,
              hint: "Adınız/soyadınız. Ana sayfadaki başlıkta, footer'daki telif hakkı satırında ve arama motorlarına gönderilen sayfa bilgilerinde (yazar adı) kullanılır. Boş bırakılırsa 'Ufuk Demir' varsayılan değeri kullanılır.",
            }
          - {
              label: "Kısa Slogan",
              name: "tagline",
              widget: "string",
              required: false,
              hint: "Ana sayfada adınızın hemen altında görünen tek cümlelik tanıtım. Arama motoru sonuçlarında da kişi açıklaması olarak kullanılabilir.",
            }
          - {
              label: "Biyografi",
              name: "bio",
              widget: "text",
              required: false,
              hint: "Ana sayfadaki okur kartında görünen tanıtım paragrafı. İndirilebilir arşiv (PDF/JSON) dosyalarının kapak sayfasında da kullanılır.",
            }
          - {
              label: "Site Açıklaması (SEO)",
              name: "siteDescription",
              widget: "text",
              required: false,
              hint: "Google gibi arama motorlarında site adınızın altında görünen açıklama metni — SEO için önemlidir. Bir blog yazısının kendi özeti olmadığında da yedek açıklama olarak kullanılır.",
            }
          - {
              label: "Kuruluş Yılı",
              name: "foundingYear",
              widget: "number",
              value_type: "int",
              required: false,
              hint: "Sitenin ilk yayına alındığı yıl. Footer'daki telif hakkı satırında kullanılır (ör. '2026–2029'), normalde bir daha değiştirmenize gerek kalmaz.",
            }
          - {
              label: "Hedef Yılı",
              name: "goalYear",
              widget: "number",
              value_type: "int",
              required: false,
              hint: "Ana sayfadaki 'Yıllık Okuma Hedefi' ilerleme çubuğunun hangi takvim yılına ait olduğunu belirler. Genelde içinde bulunduğunuz yıldır; yeni bir yıla girdiğinizde yalnızca bu alanı güncellemeniz yeterlidir.",
            }
          - {
              label: "Yıllık Okuma Hedefi (kitap)",
              name: "yearlyGoal",
              widget: "number",
              value_type: "int",
              min: 1,
              required: false,
              hint: "O yıl için kendinize koyduğunuz kitap sayısı hedefi. Ana sayfadaki ilerleme çubuğunda 'bitirilen / hedef' şeklinde gösterilir.",
            }
          - label: "Sosyal Bağlantılar"
            name: "social"
            widget: "object"
            hint: "Bu alanların tamamı isteğe bağlıdır. Bir bağlantıyı boş bırakırsanız, o bağlantıya ait buton veya satır sitede hiç görünmez — herhangi bir sorun oluşturmaz."
            fields:
              - {
                  label: "Web Sitesi (isteğe bağlı)",
                  name: "website",
                  widget: "string",
                  required: false,
                  hint: "Doldurulursa sitenin tüm sayfalarının footer'ında (en alt kısmında) 'Web sitesi' adıyla bir bağlantı olarak görünür.",
                }
              - {
                  label: "GitHub linki (isteğe bağlı)",
                  name: "github",
                  widget: "string",
                  required: false,
                  hint: "Doldurulursa ana sayfada, adınızın yanında bir GitHub butonu olarak görünür.",
                }
              - {
                  label: "LinkedIn linki (isteğe bağlı)",
                  name: "linkedin",
                  widget: "string",
                  required: false,
                  hint: "Doldurulursa ana sayfada, adınızın yanında bir LinkedIn butonu olarak görünür.",
                }
              - {
                  label: "Pinterest linki (isteğe bağlı)",
                  name: "pinterest",
                  widget: "string",
                  required: false,
                  hint: "Doldurulursa ana sayfada, adınızın yanında bir Pinterest butonu olarak görünür.",
                }
              - {
                  label: "E-posta (isteğe bağlı)",
                  name: "email",
                  widget: "string",
                  required: false,
                  hint: "Doldurulursa sitenin tüm sayfalarının footer'ında 'E-posta' adıyla, tıklandığında e-posta uygulamanızı açan bir bağlantı olarak görünür (mailto:).",
                }
