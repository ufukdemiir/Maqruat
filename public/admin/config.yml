          - label: "Site Sahipliği Doğrulama"
            name: "verification"
            widget: "object"
            hint: "Pinterest, Google Search Console gibi servisler, siteye sahip olduğunuzu kanıtlamanız için size bir doğrulama kodu verir. Kodu burada ilgili alana yapıştırın; site her sayfanın başlığına gerekli etiketi kendisi ekler, kod yazmanız gerekmez. Servisin verdiği satırın tamamını (`<meta ... />`) yapıştırsanız da yalnızca content=\"...\" içindeki kısım otomatik ayıklanır. Kaydettikten ve site yeniden yayınlandıktan (yaklaşık 1-2 dakika) sonra ilgili serviste 'Doğrula'ya basın."
            fields:
              - label: "Pinterest"
                name: "pinterest"
                widget: "string"
                required: false
                hint: "Pinterest → Ayarlar → Hesap ayarları → Talep → Web sitesi bölümünde verilen `<meta name=\"p:domain_verify\" ... />` etiketindeki content değeri."
              - label: "Google Search Console"
                name: "google"
                widget: "string"
                required: false
                hint: "Search Console → Mülk ekle → URL öneki → 'HTML etiketi' yöntemindeki `<meta name=\"google-site-verification\" ... />` etiketindeki content değeri."
              - label: "Bing Webmaster Tools"
                name: "bing"
                widget: "string"
                required: false
                hint: "Bing Webmaster Tools'un 'HTML Meta Etiketi' yönteminde verdiği `<meta name=\"msvalidate.01\" ... />` etiketindeki content değeri."
              - label: "Yandex Webmaster"
                name: "yandex"
                widget: "string"
                required: false
                hint: "Yandex Webmaster'ın 'Meta etiketi' yönteminde verdiği `<meta name=\"yandex-verification\" ... />` etiketindeki content değeri."
              - label: "Facebook (alan adı doğrulama)"
                name: "facebook"
                widget: "string"
                required: false
                hint: "Meta İş Yöneticisi → Marka Güvenliği → Alan Adları bölümünde 'Meta etiketi' yönteminde verilen `<meta name=\"facebook-domain-verification\" ... />` etiketindeki content değeri."
